      - generic [ref=f2e147]:
        - paragraph [ref=f2e148]: Praticidade, segurança e resistência em um só produto!
        - paragraph [ref=f2e149]: O Carrinho de Carga Plataforma da Brazil Home Living é o aliado perfeito para quem precisa transportar objetos pesados e volumosos com muito mais conforto e estabilidade. Robusto e funcional, suporta até 150 kg, tornando-se indispensável para uso em residências, comércios, estoques e até no dia a dia de mudanças ou reformas.
        - paragraph [ref=f2e150]: Pensado para facilitar sua rotina, o carrinho conta com freio de segurança, que evita movimentações indesejadas e garante total controle mesmo em terrenos inclinados. Além disso, seu design dobrável permite que seja guardado em qualquer cantinho após o uso, economizando espaço sem abrir mão da praticidade.
        - paragraph [ref=f2e151]: A base ampla garante firmeza ao transportar volumes maiores, enquanto os punhos e alças emborrachadasproporcionam conforto durante o manuseio, reduzindo o contato direto com o aço. Outro diferencial está na sua estrutura reforçada, fabricada em ferro de alta durabilidade, combinada a uma base revestida em borracha e ferro fundido para suportar o peso sem deformar.
        - paragraph [ref=f2e152]: Para completar, o carrinho vem equipado com quatro rodas maciças em borracha e polipropileno, de 10 cm de diâmetro, que deslizam com suavidade e oferecem mobilidade total, mesmo em pisos mais irregulares.
        - paragraph [ref=f2e153]: Mais do que um carrinho, é uma solução inteligente para tornar o transporte de cargas muito mais ágil, seguro e prático. Se você busca resistência, funcionalidade e facilidade no dia a dia, o Carrinho de Carga Plataforma da Brazil Home Living é a escolha certa.
